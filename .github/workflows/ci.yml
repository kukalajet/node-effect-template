name: CI

# Pushes to main run this workflow through the Release workflow, which calls it
# before it deploys. If you remove release.yml, add `push: { branches: [main] }`
# here.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting, lint, type checking, and unit tests.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both read the versions pinned in package.json (packageManager and
      # devEngines).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The production image (whose build runs `pnpm check` again) against a real
  # PostgreSQL: migrations, API, health checks, and worker modes.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: node-effect-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        env:
          APP_IMAGE: node-effect-template:ci
        run: bash scripts/smoke-docker.sh

  # Database adapter tests against PostgreSQL itself. Each test creates and
  # drops its own schema in this throwaway database, and the runtime role tests
  # create and drop cluster-wide roles, which needs the image's superuser.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgresql:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: node_effect
          POSTGRES_USER: node_effect
          POSTGRES_PASSWORD: node_effect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U node_effect -d node_effect"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VP_GIT_HOOKS: "0"
      DATABASE_URL: postgresql://node_effect:node_effect@127.0.0.1:5432/node_effect
      API_HOST: 127.0.0.1
      API_PORT: "8000"
      WORKER_POLL_INTERVAL_MS: "5000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres
