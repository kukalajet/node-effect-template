# Local stack. `docker compose up` starts PostgreSQL only; the `app` profile
# adds migrate, api and worker, and the `tools` profile adds worker-once.
x-app: &app
  image: ${APP_IMAGE:-node-effect-template:local}
  build:
    context: .
  # A service that needs more variables merges this map:
  # `environment: { <<: *app-environment, EXTRA: value }`.
  environment: &app-environment
    DATABASE_URL:
      postgresql://${POSTGRES_USER:-node_effect}:${POSTGRES_PASSWORD:?Set
      POSTGRES_PASSWORD in .env}@postgresql:5432/${POSTGRES_DB:-node_effect}
    API_HOST: 0.0.0.0
    API_PORT: "8000"
    WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}

services:
  postgresql:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-node_effect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-node_effect}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during first-boot initialization PostgreSQL listens on its
      # Unix socket only, so a socket check would pass before migrate can
      # connect.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  migrate:
    <<: *app
    command: ["node", "packages/database/src/migrate.ts"]
    restart: "no"
    profiles: ["app", "tools"]
    depends_on:
      postgresql:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    profiles: ["app"]
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Liveness only: a database outage must not restart the API.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health/live').then((response) =>
          process.exit(response.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    command: ["node", "apps/worker/src/main.ts"]
    # The worker exits on any failure; this policy is what restarts it.
    restart: unless-stopped
    stop_grace_period: 15s
    profiles: ["app"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-once:
    <<: *app
    command: ["node", "apps/worker/src/once.ts"]
    restart: "no"
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
